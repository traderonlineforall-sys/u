          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/support-chat.js public/styles.css public/non-critical-loader.js SECURITY_UPGRADE_STEP62_SUPPORT_STABLE_PROFESSIONAL_AR.md .cloudflare-deploy-trigger
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Step 6.2 stable support chat UI and seen notifications"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${{ github.ref_name }}"; then
              echo "Push succeeded."
              exit 0
            fi
            echo "Push failed, retry $attempt..."
            git fetch origin "${{ github.ref_name }}"
            git rebase --abort || true
            if git pull --rebase -X ours origin "${{ github.ref_name }}"; then
              continue
            fi
            conflicts="$(git diff --name-only --diff-filter=U || true)"
            if [ "$conflicts" = ".cloudflare-deploy-trigger" ]; then
              git checkout --ours .cloudflare-deploy-trigger || true
              date -u +"step62-support-stable-%Y-%m-%dT%H:%M:%SZ" > .cloudflare-deploy-trigger
              git add .cloudflare-deploy-trigger
              GIT_EDITOR=true git rebase --continue || true
              continue
            fi
            echo "Unresolved conflicts: $conflicts"
            exit 1
          done
          echo "Push failed after retries."
          exit 1
