      - name: Wire Step 5 assets into index
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'public/index.html';
          let html = fs.readFileSync(path, 'utf8');

          const cssTag = '    <link rel="stylesheet" href="support-suggestions-pro-ux.css?v=step5">';
          if (!html.includes('support-suggestions-pro-ux.css')) {
            const marker = '    <link rel="stylesheet" href="safe-tool-upgrade.css">';
            if (html.includes(marker)) {
              html = html.replace(marker, marker + '\n' + cssTag);
            } else {
              html = html.replace('</head>', cssTag + '\n</head>');
            }
          }

          const jsTag = '<script src="./support-suggestions-pro-ux.js?v=step5" defer></script>';
          if (!html.includes('support-suggestions-pro-ux.js')) {
            const marker = '<script type="module" src="./admin-message-client.js"></script>';
            if (html.includes(marker)) {
              html = html.replace(marker, marker + '\n' + jsTag);
            } else {
              html = html.replace('</body>', jsTag + '\n</body>');
            }
          }

          fs.writeFileSync(path, html);
          NODE

      - name: Commit Step 5 changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/support-suggestions-pro-ux.css public/support-suggestions-pro-ux.js public/index.html SECURITY_UPGRADE_STEP5_AR.md
          if git diff --cached --quiet; then
            echo "No Step 5 changes to commit."
            exit 0
          fi
          git commit -m "Step 5 support and suggestions UX upgrade"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
