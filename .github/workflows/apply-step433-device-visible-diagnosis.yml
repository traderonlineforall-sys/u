          node --check app/api/device-confidence-learn/route.js
          node --check app/api/device-confidence-me/route.js
          node --check public/device-confidence-learn.js

          git status --short
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/device-confidence-learn/route.js app/api/device-confidence-me/route.js public/device-confidence-learn.js public/device-confidence-test.html public/index.html public/Tags.html public/app.js SECURITY_UPGRADE_STEP433_AR.md
