name: Apply Step 5.8 Egypt Luxury Theme

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-step58-egypt-luxury-theme.yml'

permissions:
  contents: write

concurrency:
  group: step58-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-step58:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Sync latest branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ github.ref_name }}"
          git reset --hard "origin/${{ github.ref_name }}"

      - name: Write Step 5.8 patch script
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/apply_step58.py <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          
          CSS_START = "/* ===== STEP 5.8 EGYPT LUXURY THEME START ===== */"
          CSS_END = "/* ===== STEP 5.8 EGYPT LUXURY THEME END ===== */"
          JS_START = "// ===== STEP 5.8 EGYPT LUXURY DROPDOWN GUARD START ====="
          JS_END = "// ===== STEP 5.8 EGYPT LUXURY DROPDOWN GUARD END ====="
          
          CSS_BLOCK = r'''
          /* ===== STEP 5.8 EGYPT LUXURY THEME START ===== */
          :root{
            --egypt-night:#070403;
            --egypt-onyx:#0d0706;
            --egypt-wine:#260406;
            --egypt-ruby:#5f080b;
            --egypt-ruby-2:#8f1419;
            --egypt-gold:#d7ad45;
            --egypt-gold-2:#ffe9a6;
            --egypt-sand:#f6e8b7;
            --egypt-cream:#fff6d6;
            --egypt-muted:#c8b684;
            --egypt-border:rgba(215,173,69,.48);
            --egypt-border-strong:rgba(255,230,156,.82);
            --egypt-shadow:rgba(0,0,0,.58);
            --egypt-soft-shadow:rgba(36,7,7,.38);
          }
          
          html.egypt-lux-theme,
          body{
            scrollbar-color: rgba(215,173,69,.72) rgba(12,5,4,.72);
          }
          
          body::-webkit-scrollbar,
          .dropdown-content::-webkit-scrollbar,
          .sub-dropdown-content::-webkit-scrollbar,
          .search-results::-webkit-scrollbar{
            width:10px;
            height:10px;
          }
          body::-webkit-scrollbar-track,
          .dropdown-content::-webkit-scrollbar-track,
          .sub-dropdown-content::-webkit-scrollbar-track,
          .search-results::-webkit-scrollbar-track{
            background:linear-gradient(180deg, rgba(8,4,3,.85), rgba(37,5,6,.70));
            border-radius:999px;
          }
          body::-webkit-scrollbar-thumb,
          .dropdown-content::-webkit-scrollbar-thumb,
          .sub-dropdown-content::-webkit-scrollbar-thumb,
          .search-results::-webkit-scrollbar-thumb{
            background:linear-gradient(180deg, var(--egypt-gold-2), var(--egypt-gold), #8b651a);
            border:2px solid rgba(14,6,5,.88);
            border-radius:999px;
          }
          
          /* Main navigation surface */
          body .navbar,
          .navbar{
            overflow:visible !important;
            background:
              radial-gradient(760px 220px at 18% -30%, rgba(255,226,150,.14), transparent 64%),
              linear-gradient(180deg, rgba(10,5,4,.72), rgba(20,6,6,.52)) !important;
            border-top:1px solid rgba(255,232,166,.16) !important;
            border-bottom:1px solid rgba(215,173,69,.34) !important;
            box-shadow:0 14px 30px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.06) !important;
            border-radius:14px !important;
            padding:4px 8px !important;
            backdrop-filter:blur(7px) saturate(1.08);
            -webkit-backdrop-filter:blur(7px) saturate(1.08);
          }
          
          .dropdown,
          .sub-dropdown{
            overflow:visible !important;
          }
          
          .navbar a,
          #singlelink,
          .dropdown .dropbtn,
          .dropdown[style] .dropbtn,
          .dropbtn[style]{
            color:var(--egypt-sand) !important;
            background:transparent !important;
            border:1px solid transparent !important;
            border-radius:12px !important;
            text-shadow:0 1px 2px rgba(0,0,0,.75), 0 0 12px rgba(215,173,69,.10) !important;
            transition:background .18s ease, color .18s ease, border-color .18s ease, box-shadow .18s ease, transform .18s ease, filter .18s ease !important;
          }
          
          .navbar a:hover,
          #singlelink:hover,
          .dropdown:hover .dropbtn,
          .dropdown:focus-within .dropbtn,
          .dropdown .dropbtn:hover{
            color:var(--egypt-cream) !important;
            background:
              linear-gradient(180deg, rgba(129,18,23,.92), rgba(55,5,7,.94)) !important;
            border-color:rgba(255,221,132,.66) !important;
            box-shadow:
              0 9px 24px rgba(0,0,0,.40),
              0 0 0 1px rgba(255,236,171,.08) inset,
              0 0 18px rgba(215,173,69,.20) !important;
            transform:translateY(-1px);
            filter:saturate(1.08);
          }
          
          .dropdown .dropbtn .fa,
          .navbar .fa,
          .sub-dropdown .fa{
            color:var(--egypt-gold-2) !important;
            filter:drop-shadow(0 1px 2px rgba(0,0,0,.55));
          }
          
          /* Luxury dropdown panels - removes the harsh grey/red blocks */
          .dropdown-content,
          .sub-dropdown-content,
          .mmmm-content{
            display:none;
            position:absolute;
            z-index:999999 !important;
            min-width:210px !important;
            max-width:min(420px, calc(100vw - 24px)) !important;
            max-height:calc(100vh - 130px) !important;
            overflow-y:auto !important;
            overflow-x:hidden !important;
            padding:8px !important;
            color:var(--egypt-sand) !important;
            background:
              radial-gradient(420px 220px at 18% 0%, rgba(255,224,146,.16), transparent 56%),
              radial-gradient(360px 200px at 100% 100%, rgba(139,20,25,.25), transparent 58%),
              linear-gradient(180deg, rgba(31,6,7,.98), rgba(10,5,4,.97)) !important;
            border:1px solid var(--egypt-border) !important;
            border-radius:16px !important;
            box-shadow:
              0 22px 54px rgba(0,0,0,.62),
              0 0 0 1px rgba(255,237,181,.07) inset,
              inset 0 1px 0 rgba(255,255,255,.08) !important;
            backdrop-filter:blur(14px) saturate(1.18);
            -webkit-backdrop-filter:blur(14px) saturate(1.18);
          }
          
          .dropdown:hover > .dropdown-content,
          .dropdown:focus-within > .dropdown-content,
          .sub-dropdown:hover > .sub-dropdown-content,
          .sub-dropdown:focus-within > .sub-dropdown-content,
          .mmmm:hover > .mmmm-content{
            display:block !important;
            animation:egyptMenuIn .16s ease-out both;
          }
          
          @keyframes egyptMenuIn{
            from{opacity:0; transform:translateY(6px) scale(.985)}
            to{opacity:1; transform:translateY(0) scale(1)}
          }
          
          .dropdown-content a,
          .sub-dropdown-content a,
          .mmmm-content a{
            float:none !important;
            display:block !important;
            width:auto !important;
            box-sizing:border-box !important;
            margin:3px 0 !important;
            padding:10px 13px !important;
            border-radius:12px !important;
            border:1px solid rgba(255,232,166,.08) !important;
            background:linear-gradient(90deg, rgba(255,255,255,.035), rgba(255,255,255,.012)) !important;
            color:var(--egypt-sand) !important;
            text-align:left !important;
            text-decoration:none !important;
            font-weight:750 !important;
            letter-spacing:.08px !important;
            line-height:1.25 !important;
            white-space:nowrap !important;
            text-shadow:0 1px 2px rgba(0,0,0,.70) !important;
            transition:background .16s ease, color .16s ease, border-color .16s ease, box-shadow .16s ease, transform .16s ease, padding .16s ease !important;
          }
          
          .dropdown-content a:visited,
          .sub-dropdown-content a:visited,
          .mmmm-content a:visited{
            color:var(--egypt-sand) !important;
          }
          
          .dropdown-content a:hover,
          .dropdown-content a:focus-visible,
          .sub-dropdown-content a:hover,
          .sub-dropdown-content a:focus-visible,
          .mmmm-content a:hover,
          .mmmm-content a:focus-visible{
            color:#180605 !important;
            background:
              linear-gradient(135deg, #fff3bd 0%, #e8bd56 43%, #b88422 100%) !important;
            border-color:var(--egypt-border-strong) !important;
            box-shadow:
              0 10px 24px rgba(0,0,0,.42),
              0 0 0 1px rgba(255,255,255,.16) inset,
              0 0 18px rgba(215,173,69,.28) !important;
            text-shadow:0 1px 0 rgba(255,255,255,.28) !important;
            transform:translateX(4px);
            outline:none !important;
          }
          
          .sub-dropdown,
          .sub-dropdown[style]{
            background:transparent !important;
            border-radius:12px !important;
            margin:2px 0 !important;
          }
          
          .sub-dropdown:hover,
          .sub-dropdown:focus-within,
          .sub-dropdown[style]:hover{
            background:linear-gradient(90deg, rgba(215,173,69,.13), rgba(143,20,25,.18)) !important;
            box-shadow:inset 0 0 0 1px rgba(255,235,166,.12) !important;
          }
          
          .dropdown-content a.no-search,
          .sub-dropdown > a.no-search,
          .sub-dropdown-content a.no-search{
            color:var(--egypt-gold-2) !important;
            background:
              linear-gradient(90deg, rgba(143,20,25,.38), rgba(215,173,69,.12)) !important;
            border-color:rgba(215,173,69,.28) !important;
          }
          
          .sub-dropdown > a.no-search:hover{
            color:#160605 !important;
            background:linear-gradient(135deg, #fff1b3, #d7ad45) !important;
          }
          
          .dropdown-content.open-left,
          .sub-dropdown-content.open-left{
            left:auto !important;
            right:0 !important;
          }
          .sub-dropdown-content.open-left{
            right:100% !important;
          }
          
          /* Native selects and small choice widgets */
          select,
          .selectt,
          #outageNormalPanel select,
          #outageNormalPanel input,
          #outageNormalPanel textarea{
            color:var(--egypt-sand) !important;
            background:
              linear-gradient(180deg, rgba(40,7,8,.94), rgba(12,5,4,.90)) !important;
            border:1px solid rgba(215,173,69,.45) !important;
            border-radius:12px !important;
            box-shadow:inset 0 1px 0 rgba(255,255,255,.07), 0 8px 18px rgba(0,0,0,.22) !important;
          }
          select:focus,
          .selectt:focus,
          #outageNormalPanel select:focus,
          #outageNormalPanel input:focus,
          #outageNormalPanel textarea:focus{
            outline:2px solid rgba(255,230,156,.48) !important;
            outline-offset:2px !important;
            border-color:rgba(255,230,156,.74) !important;
          }
          select option,
          .selectt option,
          #outageNormalPanel select option{
            color:var(--egypt-sand) !important;
            background:#1a0506 !important;
          }
          .option-hover{
            background:linear-gradient(135deg, rgba(255,236,173,.92), rgba(215,173,69,.88)) !important;
            color:#170605 !important;
          }
          
          /* Search box and results in the same theme */
          .search-input,
          #searchInput,
          .search-container input[type="text"],
          .search-container input[type="search"]{
            color:var(--egypt-cream) !important;
            -webkit-text-fill-color:var(--egypt-cream) !important;
            background:
              linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.045)),
              rgba(11,5,4,.74) !important;
            border:1px solid rgba(215,173,69,.48) !important;
            box-shadow:0 10px 26px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.08) !important;
          }
          .search-input::placeholder,
          #searchInput::placeholder{
            color:rgba(255,235,178,.72) !important;
            opacity:1 !important;
          }
          .search-input:focus,
          #searchInput:focus{
            border-color:rgba(255,230,156,.86) !important;
            box-shadow:0 0 0 3px rgba(215,173,69,.18), 0 12px 28px rgba(0,0,0,.38) !important;
          }
          .search-results{
            background:
              radial-gradient(500px 220px at 0 0, rgba(255,225,150,.13), transparent 62%),
              linear-gradient(180deg, rgba(31,6,7,.98), rgba(8,4,3,.98)) !important;
            border:1px solid rgba(215,173,69,.55) !important;
            border-radius:16px !important;
            box-shadow:0 22px 54px rgba(0,0,0,.60), inset 0 1px 0 rgba(255,255,255,.06) !important;
            padding:8px !important;
          }
          .search-results a,
          .search-results .highlight{
            color:var(--egypt-sand) !important;
            background:linear-gradient(90deg, rgba(255,255,255,.035), rgba(255,255,255,.012)) !important;
            border:1px solid rgba(215,173,69,.18) !important;
            border-radius:12px !important;
            margin:3px 0 !important;
          }
          .search-results a:hover{
            color:#160605 !important;
            background:linear-gradient(135deg, #fff3bd, #d7ad45) !important;
            border-color:rgba(255,230,156,.76) !important;
          }
          
          /* Replace old purple/grey accents with the Egypt palette */
          .toolsStyle,
          .ireportStyle,
          .yy,
          .service-btn,
          .discount-btn,
          .extra-btn,
          .op-btn,
          .add-btn,
          .vat-btn,
          .ocrBtn,
          .outage-mail-btn,
          .copyBtn,
          .quota-copy-btn,
          #reset1,
          #tabs .tablinks,
          .tab button{
            color:var(--egypt-sand) !important;
            background:
              linear-gradient(180deg, rgba(105,13,16,.90), rgba(38,5,6,.94)) !important;
            border:1px solid rgba(215,173,69,.48) !important;
            border-radius:12px !important;
            box-shadow:0 9px 20px rgba(0,0,0,.30), inset 0 1px 0 rgba(255,255,255,.07) !important;
            text-shadow:0 1px 2px rgba(0,0,0,.70) !important;
            transition:transform .16s ease, box-shadow .16s ease, background .16s ease, color .16s ease, border-color .16s ease !important;
          }
          .toolsStyle:hover,
          .ireportStyle:hover,
          .yy:hover,
          .service-btn:hover,
          .discount-btn:hover,
          .extra-btn:hover,
          .op-btn:hover,
          .add-btn:hover,
          .vat-btn:hover,
          .ocrBtn:hover,
          .outage-mail-btn:hover,
          .copyBtn:hover,
          .quota-copy-btn:hover,
          #reset1:hover,
          #tabs .tablinks:hover,
          .tab button:hover{
            color:#180605 !important;
            background:linear-gradient(135deg, #fff1b3, #d7ad45, #b88422) !important;
            border-color:rgba(255,230,156,.80) !important;
            box-shadow:0 12px 28px rgba(0,0,0,.40), 0 0 18px rgba(215,173,69,.22) !important;
            text-shadow:0 1px 0 rgba(255,255,255,.26) !important;
            transform:translateY(-1px) !important;
          }
          #tabs .tablinks.active,
          .tab button.active{
            color:#160605 !important;
            background:linear-gradient(135deg, #fff4bf, #e2b94c 55%, #9a681a) !important;
            border-color:rgba(255,230,156,.90) !important;
            box-shadow:0 14px 30px rgba(0,0,0,.42), 0 0 22px rgba(215,173,69,.25) !important;
          }
          
          /* Cards/panels that previously used light grey or purple blocks */
          .tab,
          #dddiv,
          #Formmm,
          .quota-summary-card,
          .converter-card,
          .highlight-box,
          .support-overlay .support-modal,
          .admin-tab-panel{
            color:var(--egypt-sand) !important;
            background:
              radial-gradient(620px 260px at 12% -15%, rgba(255,226,150,.13), transparent 60%),
              linear-gradient(180deg, rgba(30,6,7,.92), rgba(10,5,4,.90)) !important;
            border:1px solid rgba(215,173,69,.34) !important;
            box-shadow:0 18px 42px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.07) !important;
          }
          
          /* Better readable inputs without changing layout */
          input:not([type="checkbox"]):not([type="radio"]):not(.search-input),
          textarea{
            border-color:rgba(215,173,69,.38) !important;
          }
          input:not([type="checkbox"]):not([type="radio"]):focus,
          textarea:focus{
            outline:2px solid rgba(215,173,69,.34) !important;
            outline-offset:2px !important;
          }
          
          @media (max-width: 900px){
            .dropdown-content,
            .sub-dropdown-content{
              max-width:calc(100vw - 18px) !important;
              min-width:min(280px, calc(100vw - 18px)) !important;
            }
            .dropdown-content a,
            .sub-dropdown-content a{
              white-space:normal !important;
            }
          }
          /* ===== STEP 5.8 EGYPT LUXURY THEME END ===== */
          '''.strip()
          
          JS_BLOCK = r'''
          // ===== STEP 5.8 EGYPT LUXURY DROPDOWN GUARD START =====
          (function(){
            if (window.__EGYPT_LUX_DROPDOWN_GUARD__) return;
            window.__EGYPT_LUX_DROPDOWN_GUARD__ = true;
          
            function markTheme(){
              try { document.documentElement.classList.add('egypt-lux-theme'); } catch(_e) {}
            }
          
            function placeMenu(menu, isSubMenu){
              if (!menu) return;
              menu.classList.remove('open-left');
              window.requestAnimationFrame(function(){
                try {
                  var rect = menu.getBoundingClientRect();
                  var margin = 12;
                  if (rect.right > window.innerWidth - margin) menu.classList.add('open-left');
                  if (!isSubMenu && rect.left < margin) menu.classList.remove('open-left');
                } catch(_e) {}
              });
            }
          
            function bindEgyptDropdownGuard(){
              markTheme();
              document.querySelectorAll('.dropdown').forEach(function(dropdown){
                if (dropdown.dataset.egyptLuxBound === '1') return;
                dropdown.dataset.egyptLuxBound = '1';
                dropdown.addEventListener('mouseenter', function(){
                  placeMenu(dropdown.querySelector(':scope > .dropdown-content'), false);
                }, { passive: true });
                dropdown.addEventListener('focusin', function(){
                  placeMenu(dropdown.querySelector(':scope > .dropdown-content'), false);
                });
              });
          
              document.querySelectorAll('.sub-dropdown').forEach(function(subDropdown){
                if (subDropdown.dataset.egyptLuxBound === '1') return;
                subDropdown.dataset.egyptLuxBound = '1';
                subDropdown.addEventListener('mouseenter', function(){
                  placeMenu(subDropdown.querySelector(':scope > .sub-dropdown-content'), true);
                }, { passive: true });
                subDropdown.addEventListener('focusin', function(){
                  placeMenu(subDropdown.querySelector(':scope > .sub-dropdown-content'), true);
                });
              });
            }
          
            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', bindEgyptDropdownGuard, { once: true });
            } else {
              bindEgyptDropdownGuard();
            }
            window.addEventListener('resize', bindEgyptDropdownGuard, { passive: true });
          })();
          // ===== STEP 5.8 EGYPT LUXURY DROPDOWN GUARD END =====
          '''.strip()
          
          
          def replace_block(text: str, start: str, end: str, block: str) -> str:
              if start in text and end in text:
                  a = text.index(start)
                  b = text.index(end, a) + len(end)
                  return text[:a].rstrip() + "\n\n" + block + "\n" + text[b:].lstrip()
              return text.rstrip() + "\n\n" + block + "\n"
          
          css_path = Path('public/styles.css')
          js_path = Path('public/app.js')
          for p in (css_path, js_path):
              if not p.exists():
                  raise SystemExit(f'Missing required file: {p}')
          
          css_text = css_path.read_text(encoding='utf-8')
          css_path.write_text(replace_block(css_text, CSS_START, CSS_END, CSS_BLOCK), encoding='utf-8')
          
          js_text = js_path.read_text(encoding='utf-8')
          js_path.write_text(replace_block(js_text, JS_START, JS_END, JS_BLOCK), encoding='utf-8')
          
          Path('SECURITY_UPGRADE_STEP58_EGYPT_LUXURY_THEME_AR.md').write_text('''# Step 5.8 - Egypt Luxury Theme Upgrade
          
          تم تطبيق تحسين بصري شامل متناسق مع ثيم مصر:
          
          - القوائم المنسدلة أصبحت Dark Burgundy + Gold بدل الرمادي/الأحمر المزعج.
          - تحسين hover/focus لكل الاختيارات لتكون واضحة وفخمة ومريحة للعين.
          - توحيد ألوان search results والـ selects والأزرار والتابات مع نفس الثيم.
          - زيادة z-index والـ max-height للقوائم حتى لا تختفي خلف عناصر أخرى.
          - تحسين فتح القوائم يمين/يسار تلقائيًا حسب مساحة الشاشة.
          
          التعديل CSS/JS فقط ولا يغير API أو بيانات Supabase.
          ''', encoding='utf-8')
          
          Path('.cloudflare-deploy-trigger').write_text('step58-egypt-luxury-theme ' + datetime.now(timezone.utc).isoformat() + '\n', encoding='utf-8')
          PY

      - name: Apply Egypt luxury theme and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Apply attempt $attempt"
            git fetch origin "${{ github.ref_name }}"
            git reset --hard "origin/${{ github.ref_name }}"

            python3 /tmp/apply_step58.py

            git add public/styles.css public/app.js SECURITY_UPGRADE_STEP58_EGYPT_LUXURY_THEME_AR.md .cloudflare-deploy-trigger
            if git diff --cached --quiet; then
              echo "No changes to commit."
              exit 0
            fi

            git commit -m "Step 5.8 Egypt luxury theme upgrade"
            if git push origin "HEAD:${{ github.ref_name }}"; then
              echo "Step 5.8 applied and pushed successfully."
              exit 0
            fi

            echo "Push failed, another run probably updated the branch. Retrying from the latest origin state..."
            sleep 2
          done

          echo "Could not push after 3 safe attempts. Please rerun the workflow."
          exit 1
