name: Apply Step 4 Central Nickname Identity

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apply-step4-central-nickname.yml"

permissions:
  contents: write

jobs:
  apply-step4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Step 4 files
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          cat > /tmp/sr-step4-files.tar.gz.b64 <<'B64'
          
          B64
          base64 -d /tmp/sr-step4-files.tar.gz.b64 > /tmp/sr-step4-files.tar.gz
          tar -xzf /tmp/sr-step4-files.tar.gz -C .

      - name: Commit Step 4 changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .cloudflare-deploy-trigger \
            SECURITY_UPGRADE_STEP4_AR.md \
            SUPABASE_NICKNAME_IDENTITY_STEP4.sql \
            SUPABASE_NICKNAME_IDENTITY_STEP4_ROLLBACK.sql \
            app/login/page.js \
            app/api/admin-delete-support-user/route.js \
            app/api/login/route.js \
            app/api/public-suggestion/route.js \
            app/api/public-suggestion-reply/route.js \
            app/api/support-profile/route.js \
            app/api/support-message/route.js \
            lib/server/nickname.js \
            public/admin.js \
            public/online-users-count.js \
            public/stable-user-identity.js \
            public/suggestions.js \
            public/support-chat.js \
            public/support-presence-visual.js
          if git diff --cached --quiet; then
            echo "No Step 4 changes needed."
            exit 0
          fi
          git commit -m "Step 4: central nickname identity"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
