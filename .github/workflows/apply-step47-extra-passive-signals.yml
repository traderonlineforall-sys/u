      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in             lib/server/device-confidence.js             app/login/page.js             public/device-confidence-learn.js             app/api/login/route.js             app/api/device-confidence-learn/route.js             app/api/admin-device-profiles/route.js             public/admin.js
          do
            node --check "$f"
          done

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Step 4.7 extra passive device signals"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
