name: Apply Step 4.3.1 Device Auto Learn

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apply-step431-device-autolearn.yml"

permissions:
  contents: write

jobs:
  apply-step431:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Step 4.3.1 files
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          cat > /tmp/sr-step431-files.tar.gz.b64 <<'B64'
          
          B64
          base64 -d /tmp/sr-step431-files.tar.gz.b64 > /tmp/sr-step431-files.tar.gz
          tar -xzf /tmp/sr-step431-files.tar.gz -C .
          git status --short
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/device-confidence-learn/route.js public/device-confidence-learn.js app/layout.js SECURITY_UPGRADE_STEP431_AR.md
          git commit -m "Step 4.3.1 device confidence auto learn"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
