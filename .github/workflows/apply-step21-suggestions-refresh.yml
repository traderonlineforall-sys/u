name: Apply Step 2.1 Suggestions Refresh Fix

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apply-step21-suggestions-refresh.yml"

permissions:
  contents: write

jobs:
  apply-step21:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch suggestion refresh behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if new in text:
                  return text
              if old not in text:
                  print(f"WARN: pattern not found for {label}")
                  return text
              return text.replace(old, new, 1)

          sug_path = Path("public/suggestions.js")
          admin_path = Path("public/admin.js")

          if not sug_path.exists():
              raise SystemExit("public/suggestions.js not found")
          if not admin_path.exists():
              raise SystemExit("public/admin.js not found")

          s = sug_path.read_text(encoding="utf-8")

          s = s.replace("// Realtime updates (INSERT only)", "// Realtime updates (INSERT/UPDATE/DELETE)")
          s = s.replace('{ event: "INSERT", schema: "public", table: "suggestions" }', '{ event: "*", schema: "public", table: "suggestions" }')
          s = s.replace('{ event: "INSERT", schema: "public", table: "suggestion_replies" }', '{ event: "*", schema: "public", table: "suggestion_replies" }')

          listener = '  window.addEventListener("sr:suggestions-changed", () => loadSuggestions());\n'
          if listener not in s:
              marker = "  // Initial load\n  loadSuggestions();\n"
              if marker in s:
                  s = s.replace(marker, marker + listener, 1)
              else:
                  print("WARN: initial load marker not found; suggestions custom refresh listener was not added")

          sug_path.write_text(s, encoding="utf-8")

          a = admin_path.read_text(encoding="utf-8")

          a = replace_once(
              a,
              '      setAdminStatus("Deleted ✅");\n      await refreshSuggestions();\n',
              '      setAdminStatus("Deleted ✅");\n      await refreshSuggestions();\n      window.dispatchEvent(new CustomEvent("sr:suggestions-changed"));\n',
              "admin delete suggestion refresh event",
          )

          a = replace_once(
              a,
              '      await refreshSuggestions();\n      await refreshBlocks();\n',
              '      await refreshSuggestions();\n      window.dispatchEvent(new CustomEvent("sr:suggestions-changed"));\n      await refreshBlocks();\n',
              "admin delete+block suggestion refresh event",
          )

          admin_path.write_text(a, encoding="utf-8")
          PY

      - name: Commit Step 2.1 changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/suggestions.js public/admin.js
          if git diff --cached --quiet; then
            echo "No Step 2.1 changes needed."
            exit 0
          fi
          git commit -m "Step 2.1: refresh suggestions after delete"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
